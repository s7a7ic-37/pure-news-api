name: API checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pure_news_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pure_news_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: pure_news_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check initial setup and repeat startup
        run: |
          npm run bootstrap-demo
          npm run bootstrap-demo
      - run: npm test
      - name: Scan tracked source for credentials
        run: |
          mkdir -p "$RUNNER_TEMP/credential-scan"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/credential-scan"
          docker run --rm --network none --read-only -v "$RUNNER_TEMP/credential-scan:/scan:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /scan --redact=100 --no-banner
